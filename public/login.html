<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – SafeDrop</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/theme.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #0f0f17;
      --card:  rgba(20,20,33,.95);
      --ibg:   rgba(255,255,255,.05);
      --bdr:   rgba(255,255,255,.08);
      --ac:    #6366f1;
      --ac2:   #4f46e5;
      --glow:  rgba(99,102,241,.22);
      --ok:    #10b981;
      --err:   #ef4444;
      --tx:    #e2e8f0;
      --mt:    #64748b;
      --dm:    #94a3b8;
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    body::before {
      content: '';
      position: fixed; top: -250px; left: 50%; transform: translateX(-50%);
      width: 700px; height: 700px;
      background: radial-gradient(circle, var(--glow-ambient, rgba(99,102,241,.09)), transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .theme-switcher {
      position: fixed; top: 14px; right: 16px; z-index: 200;
      display: flex; align-items: center; gap: 2px;
      background: var(--ibg); border: 1px solid var(--bdr);
      border-radius: 999px; padding: 3px;
    }
    .theme-btn {
      width: 26px; height: 26px; border-radius: 999px; border: none;
      background: none; color: var(--dm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .theme-btn:hover { color: var(--tx); }
    .theme-btn.active { background: var(--ac); color: #fff; box-shadow: 0 0 8px var(--glow); }
    .theme-btn svg { pointer-events: none; }

    .logo {
      display: flex; align-items: center; gap: 9px;
      font-size: 1rem; font-weight: 700;
      color: var(--tx); text-decoration: none;
      letter-spacing: -.01em;
      margin-bottom: 28px;
      position: relative; z-index: 1;
    }
    .logo img { width: 28px; height: 28px; border-radius: 6px; }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      background: var(--card);
      border: 1px solid var(--bdr);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
      backdrop-filter: blur(20px);
    }

    .stripe {
      height: 3px;
      background: linear-gradient(90deg, var(--ac), #8b5cf6);
    }

    .body {
      padding: 28px 26px 26px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: .8rem;
      color: var(--mt);
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--dm);
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      background: var(--ibg);
      border: 1px solid var(--bdr);
      border-radius: 9px;
      padding: 11px 13px;
      color: var(--tx);
      font-size: .875rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .input:focus {
      border-color: rgba(99,102,241,.5);
      box-shadow: 0 0 0 3px var(--glow);
    }
    .input::placeholder { color: var(--mt); }

    .error-box {
      display: flex; align-items: center; gap: 8px;
      background: rgba(239,68,68,.07);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: .78rem;
      color: #fca5a5;
      animation: shake .25s ease;
    }
    .error-box svg { width: 14px; height: 14px; flex-shrink: 0; }
    .hidden { display: none !important; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      30%      { transform: translateX(-5px); }
      70%      { transform: translateX(5px); }
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 6px; padding: 13px;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      border: none; border-radius: 9px;
      color: #fff; font-size: .9rem; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--glow);
      transition: all .2s;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px var(--glow);
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .7s linear infinite; }

    .date-line {
      font-size: .72rem; color: var(--mt); text-align: center;
      margin-top: 18px; position: relative; z-index: 1;
    }
    .btn-guest {
      display: flex; align-items: center; gap: 12px;
      width: 100%; margin-top: 10px; padding: 13px 15px;
      background: rgba(245,158,11,.06); border: 1px solid rgba(245,158,11,.3);
      border-radius: 9px; color: var(--dm);
      cursor: pointer; text-align: left;
      transition: all .18s;
    }
    .btn-guest:hover {
      border-color: rgba(245,158,11,.55); color: #fcd34d;
      background: rgba(245,158,11,.12);
    }
    .btn-guest-icon {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 8px;
      background: rgba(245,158,11,.12);
      display: flex; align-items: center; justify-content: center;
    }
    .btn-guest-icon svg { width: 16px; height: 16px; }
    .btn-guest-title { font-size: .85rem; font-weight: 600; line-height: 1.3; }
    .btn-guest-sub { font-size: .72rem; opacity: .65; margin-top: 2px; }
    .pp-teaser {
      display: flex; align-items: center; gap: 5px;
      margin-top: 9px; font-size: .7rem; color: var(--mt);
      justify-content: center; line-height: 1.4;
    }
    .pp-teaser svg { width: 11px; height: 11px; flex-shrink: 0; color: #6ee7b7; }
    @media (max-width: 420px) {
      .body { padding: 22px 18px 20px; }
    }
  </style>
</head>
<body>

  <div class="theme-switcher" id="theme-switcher"></div>

  <a class="logo" href="/">
    <img src="/favicon.svg" alt="SafeDrop">
    SafeDrop
  </a>

  <div class="card">
    <div class="stripe"></div>
    <div class="body">
      <div class="card-title">Sign In</div>
      <div class="card-sub">Please sign in with your account.</div>

      <div class="error-box hidden" id="err-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="err-msg"></span>
      </div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input class="input" type="text" id="username" name="username"
                 placeholder="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password"
                 placeholder="••••••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="btn-login">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In
        </button>
      </form>

      <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
        <div style="flex:1;height:1px;background:var(--bdr)"></div>
        <span style="font-size:.7rem;color:var(--mt)">or</span>
        <div style="flex:1;height:1px;background:var(--bdr)"></div>
      </div>

      <button class="btn-guest" id="btn-guest">
        <div class="btn-guest-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
            <line x1="12" y1="11" x2="12" y2="16"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </div>
        <div>
          <div class="btn-guest-title">Upload anonymously</div>
          <div class="btn-guest-sub">4h · password required · no account needed</div>
        </div>
      </button>
      <div class="pp-teaser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Inkl. <strong style="color:var(--dm)">&nbsp;SafeDrop + Password-Push</strong>&nbsp;— Secrets sicher per One-Time-Link teilen
      </div>
    </div>
  </div>

  <div class="date-line" id="date-line"></div>

<script>
  window.fsTheme.renderSwitcher('theme-switcher');
  document.getElementById('date-line').textContent =
    new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  document.getElementById('btn-guest').addEventListener('click', async () => {
    const btn = document.getElementById('btn-guest');
    btn.disabled = true;
    btn.style.opacity = '.5';
    try {
      const r = await fetch('/api/auth/guest', { method: 'POST' });
      if (r.ok) {
        location.replace('/');
      } else {
        const d = await r.json().catch(() => ({}));
        showErr(d.error || 'Guest login failed (HTTP ' + r.status + ')');
        btn.disabled = false; btn.style.opacity = '';
      }
    } catch {
      showErr('Connection error – server not reachable.');
      btn.disabled = false; btn.style.opacity = '';
    }
  });

  // If already logged in, go home
  fetch('/api/auth/me').then(r => {
    if (r.ok) location.replace('/');
  }).catch(() => {});

  const form = document.getElementById('login-form');
  const errBox = document.getElementById('err-box');
  const errMsg = document.getElementById('err-msg');
  const btn = document.getElementById('btn-login');

  function showErr(msg) {
    errMsg.textContent = msg;
    errBox.classList.remove('hidden');
    errBox.style.animation = 'none';
    errBox.offsetHeight;
    errBox.style.animation = '';
  }

  function setBusy(on) {
    btn.disabled = on;
    btn.innerHTML = on
      ? '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10" stroke-opacity=".2"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg> Signing in …'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In';
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errBox.classList.add('hidden');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showErr('Please fill in all fields.'); return; }

    setBusy(true);
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const d = await r.json();
      if (!r.ok) { showErr(d.error || 'Sign-in failed.'); setBusy(false); return; }
      // Redirect – admin goes to /admin, users go to /
      location.replace(d.role === 'admin' ? '/admin' : '/');
    } catch {
      showErr('Verbindungsfehler. Bitte erneut versuchen.');
      setBusy(false);
    }
  });
</script>
</body>
</html>
