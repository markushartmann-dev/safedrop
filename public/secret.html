<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Secret – SafeDrop</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <style>
    .secret-box {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px;
      font-family: monospace;
      font-size: .9rem;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.7;
      color: var(--text);
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 14px;
    }
    .views-bar {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 8px 14px;
      background: rgba(239,68,68,.07);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 8px;
      font-size: .78rem; color: #fca5a5;
      margin-bottom: 16px;
    }
    .views-bar svg { width: 13px; height: 13px; flex-shrink: 0; }
    .views-bar.safe {
      background: rgba(16,185,129,.07);
      border-color: rgba(16,185,129,.2);
      color: #6ee7b7;
    }
    .info-card {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .state-icon {
      width: 58px; height: 58px; margin: 0 auto 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .state-icon.pending  { background: rgba(99,102,241,.1);  border: 1.5px solid rgba(99,102,241,.3);  color: var(--accent); }
    .state-icon.revealed { background: rgba(16,185,129,.1);  border: 1.5px solid rgba(16,185,129,.3);  color: var(--success); animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
    .state-icon.error    { background: rgba(239,68,68,.1);   border: 1.5px solid rgba(239,68,68,.3);   color: var(--danger); }
    .state-icon.gone     { background: rgba(148,163,184,.08); border: 1.5px solid rgba(148,163,184,.15); color: var(--muted); }
    @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <img src="/favicon.svg" alt="SafeDrop">
    SafeDrop
  </a>
  <div class="theme-switcher" id="theme-switcher"></div>
  <div style="display:flex;align-items:center;gap:8px">
    <a class="header-admin-link" href="/">← SafeDrop</a>
    <a class="header-admin-link" href="/push">🔐 Pusher</a>
  </div>
</header>

<main>
  <div class="card" id="card-main" style="text-align:center">

    <!-- Loading state -->
    <div id="state-loading">
      <div class="state-icon pending">
        <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
          <circle cx="12" cy="12" r="10" stroke-opacity=".2"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 style="font-size:1rem;font-weight:600;margin-bottom:6px">Loading …</h2>
    </div>

    <!-- Pending: secret exists, not yet revealed -->
    <div id="state-pending" class="hidden">
      <div class="state-icon pending">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2 style="font-size:1.05rem;font-weight:700;margin-bottom:6px">A secret is waiting for you</h2>
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:20px" id="pending-meta"></p>

      <div id="pp-required" class="hidden" style="margin-bottom:18px;text-align:left">
        <span class="opt-label">Password</span>
        <div class="pw-gen-row" style="margin-top:6px">
          <input type="password" id="pp-input" class="input"
            placeholder="Password from sender"
            autocomplete="off">
        </div>
        <div id="pp-err" class="hidden" style="margin-top:8px;padding:8px 11px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:7px;font-size:.78rem;color:#fca5a5"></div>
      </div>

      <button class="btn-primary" id="btn-reveal" style="max-width:280px;margin:0 auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        View secret
      </button>
      <p style="font-size:.72rem;color:var(--muted);margin-top:10px" id="reveal-warning"></p>
    </div>

    <!-- Revealed state -->
    <div id="state-revealed" class="hidden" style="text-align:left">
      <div class="state-icon revealed" style="margin:0 auto 18px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="26" height="26">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2 class="success-title" style="margin-bottom:6px">Secret revealed</h2>
      <p class="success-subtitle" style="margin-bottom:16px" id="revealed-meta"></p>

      <div id="destroyed-notice" class="hidden" style="margin-bottom:14px;padding:10px 13px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:8px;font-size:.78rem;color:#fca5a5;display:flex;gap:8px;align-items:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" style="flex-shrink:0"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        This secret has been permanently deleted after this view.
      </div>

      <div id="remaining-notice" class="hidden" style="margin-bottom:14px;padding:10px 13px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);border-radius:8px;font-size:.78rem;color:#6ee7b7;display:flex;gap:8px;align-items:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="remaining-text"></span>
      </div>

      <div class="secret-box" id="secret-content"></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-primary" id="btn-copy-secret" style="flex:1;min-width:120px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <a href="/push" class="btn-ghost" style="flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:0;text-decoration:none">
          Create your own secret
        </a>
      </div>
    </div>

    <!-- Error / gone state -->
    <div id="state-error" class="hidden">
      <div class="state-icon gone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26">
          <circle cx="12" cy="12" r="10"/>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
      </div>
      <h2 style="font-size:1.05rem;font-weight:700;margin-bottom:8px" id="error-title">Not found</h2>
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:20px" id="error-msg">This secret has already been retrieved, has expired, or does not exist.</p>
      <a href="/push" class="btn-ghost" style="display:inline-block;max-width:240px;margin:0 auto;text-decoration:none">Create your own secret</a>
    </div>

  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const token = location.pathname.split('/').pop();
let _passphraseRequired = false;

function showState(name) {
  ['loading','pending','revealed','error'].forEach(s =>
    $('state-' + s).classList.toggle('hidden', s !== name));
}

// ── Load info ─────────────────────────────────────────────────────────────────
async function loadInfo() {
  try {
    const r = await fetch('/api/secret/' + token + '/info');
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      $('error-title').textContent = r.status === 410 ? 'Expired' : 'Unavailable';
      $('error-msg').textContent = d.error || 'This secret is no longer available.';
      showState('error');
      return;
    }
    const info = await r.json();
    _passphraseRequired = info.passphraseRequired;

    if (_passphraseRequired) {
      $('pp-required').classList.remove('hidden');
    }

    const viewsLeft = info.viewsLeft;
    const expMs = info.expiresAt - Date.now();
    $('pending-meta').textContent = `${viewsLeft} view${viewsLeft !== 1 ? 's' : ''} remaining · expires in ${fmtDur(expMs)}`;

    if (viewsLeft <= 1) {
      $('reveal-warning').textContent = '⚠ After this view the secret will be permanently deleted.';
    } else {
      $('reveal-warning').textContent = `Automatically deleted after ${info.viewsMax} view${info.viewsMax !== 1 ? 's' : ''}.`;
    }

    showState('pending');
  } catch (e) {
    $('error-msg').textContent = 'Connection error. Please reload the page.';
    showState('error');
  }
}

// ── Reveal ────────────────────────────────────────────────────────────────────
$('btn-reveal').addEventListener('click', reveal);
$('pp-input').addEventListener('keydown', e => { if (e.key === 'Enter') reveal(); });

async function reveal() {
  const passphrase = _passphraseRequired ? $('pp-input').value.trim() : null;
  if (_passphraseRequired && !passphrase) {
    $('pp-err').textContent = 'Please enter a password.';
    $('pp-err').classList.remove('hidden');
    return;
  }
  $('pp-err').classList.add('hidden');
  $('btn-reveal').disabled = true;
  $('btn-reveal').innerHTML = '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10" stroke-opacity=".2"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg> Retrieving …';

  try {
    const r = await fetch('/api/secret/' + token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passphrase })
    });
    const d = await r.json();

    if (!r.ok) {
      if (r.status === 401) {
        $('pp-err').textContent = d.error || 'Wrong password.';
        $('pp-err').classList.remove('hidden');
        $('btn-reveal').disabled = false;
        $('btn-reveal').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> View secret';
        return;
      }
      $('error-title').textContent = r.status === 410 ? 'Expired' : 'Error';
      $('error-msg').textContent = d.error || 'Unknown error.';
      showState('error');
      return;
    }

    // Show revealed state
    $('secret-content').textContent = d.content;

    if (d.destroyed) {
      $('destroyed-notice').classList.remove('hidden');
      $('remaining-notice').classList.add('hidden');
      $('revealed-meta').textContent = 'The secret was deleted after this view.';
    } else {
      $('destroyed-notice').classList.add('hidden');
      $('remaining-notice').classList.remove('hidden');
      $('remaining-text').textContent = `${d.viewsLeft} view${d.viewsLeft !== 1 ? 's' : ''} remaining before automatic deletion.`;
      $('revealed-meta').textContent = `${d.viewsUsed} of ${d.viewsMax} view${d.viewsMax !== 1 ? 's' : ''} used.`;
    }

    showState('revealed');

  } catch (e) {
    $('error-msg').textContent = 'Connection error: ' + e.message;
    showState('error');
  }
}

// ── Copy secret ───────────────────────────────────────────────────────────────
$('btn-copy-secret').addEventListener('click', function() {
  navigator.clipboard.writeText($('secret-content').textContent);
  this.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg> Copied';
  this.style.background = 'var(--success)';
  setTimeout(() => {
    this.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
    this.style.background = '';
  }, 2000);
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtDur(ms) {
  const s = ms / 1000;
  if (s < 60) return Math.round(s) + ' sec';
  if (s < 3600) return Math.round(s / 60) + ' min';
  if (s < 86400) return (s / 3600).toFixed(1) + ' hrs';
  return Math.floor(s / 86400) + ' day(s)';
}

window.fsTheme.renderSwitcher('theme-switcher');
loadInfo();
</script>
</body>
</html>
