<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" width="760" height="800">
  <defs>
    <linearGradient id="logog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="btng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b1f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0b1f" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="screen"><rect width="760" height="800" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">

  <!-- Background -->
  <rect width="760" height="800" fill="#0b0b1f"/>

  <!-- ── Header ── -->
  <rect width="760" height="56" fill="#0e0e26"/>
  <line x1="0" y1="56" x2="760" y2="56" stroke="#1e1e3a" stroke-width="1"/>

  <!-- Logo icon -->
  <rect x="22" y="14" width="28" height="28" rx="7" fill="url(#logog)"/>
  <path d="M36,24 L36,30" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="32,27 36,23 40,27" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M30,36 L30,38 a1,1 0 0 0 1,1 L41,39 a1,1 0 0 0 1,-1 L42,36" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="58" y="36" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700" font-size="15">SafeDrop</text>

  <!-- Date chip -->
  <rect x="132" y="18" width="132" height="21" rx="10.5" fill="rgba(255,255,255,0.04)" stroke="#1e1e3a" stroke-width="1"/>
  <text x="198" y="33" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">Tue, 17 Jun 2025</text>

  <!-- Theme toggle (far right area) -->
  <rect x="524" y="17" width="28" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#1e1e3a" stroke-width="1"/>
  <circle cx="538" cy="28" r="4.5" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Admin btn -->
  <rect x="558" y="17" width="54" height="22" rx="6" fill="rgba(255,255,255,0.04)" stroke="#1e1e3a" stroke-width="1"/>
  <text x="585" y="32" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11" text-anchor="middle">Admin</text>

  <!-- Username -->
  <text x="622" y="32" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600">admin</text>

  <!-- Sign out btn -->
  <rect x="662" y="17" width="78" height="22" rx="6" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="701" y="32" fill="#f87171" font-family="-apple-system,sans-serif" font-size="11" text-anchor="middle">Sign out</text>

  <!-- ── Mode cards (y 76–172) ── -->

  <!-- Card 1: File Sharing (active, indigo) -->
  <rect x="40" y="76" width="330" height="96" rx="14" fill="rgba(99,102,241,0.1)" stroke="rgba(99,102,241,0.38)" stroke-width="1"/>
  <rect x="58" y="94" width="40" height="40" rx="10" fill="rgba(99,102,241,0.18)"/>
  <!-- upload icon -->
  <path d="M78,113 L78,107" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <polyline points="74,111 78,107 82,111" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M72,119 L72,121 a2,2 0 0 0 2,2 L84,123 a2,2 0 0 0 2,-2 L86,119" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="108" y="111" fill="#a5b4fc" font-family="-apple-system,sans-serif" font-weight="700" font-size="13.5">File Sharing</text>
  <text x="108" y="127" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">Upload &amp; share files securely.</text>
  <text x="108" y="141" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">AES-256 encryption, configurable</text>
  <text x="108" y="155" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">expiry and download limits.</text>

  <!-- Card 2: Password Pusher -->
  <rect x="382" y="76" width="338" height="96" rx="14" fill="#12122a" stroke="#1e1e3a" stroke-width="1"/>
  <rect x="400" y="94" width="40" height="40" rx="10" fill="rgba(16,185,129,0.13)"/>
  <!-- lock icon -->
  <rect x="411" y="113" width="18" height="13" rx="3" fill="none" stroke="#6ee7b7" stroke-width="1.8"/>
  <path d="M414,113 L414,109 a6,6 0 0 1 12,0 L426,113" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round"/>
  <text x="450" y="111" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-weight="700" font-size="13.5">Password Pusher</text>
  <text x="450" y="127" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">Share secrets via self-destructing</text>
  <text x="450" y="141" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">one-time links. Auto-deleted</text>
  <text x="450" y="155" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">after retrieval.</text>

  <!-- ── Upload card (y 188–584) ── -->
  <rect x="40" y="188" width="680" height="396" rx="18" fill="#12122a" stroke="#1a1a38" stroke-width="1"/>

  <!-- Drop zone (y 206–358) -->
  <rect x="60" y="206" width="640" height="152" rx="14" fill="none" stroke="#2a2a62" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- drop icon -->
  <circle cx="380" cy="252" r="24" fill="rgba(99,102,241,0.1)"/>
  <path d="M380,245 L380,239" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="375,243 380,239 385,243" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M372,259 L372,261 a2,2 0 0 0 2,2 L386,263 a2,2 0 0 0 2,-2 L388,259" stroke="#6366f1" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="380" y="286" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-weight="600" font-size="14.5" text-anchor="middle">Drop file or folder here</text>
  <text x="336" y="308" fill="#6366f1" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="500">Choose file</text>
  <text x="362" y="308" fill="#64748b" font-family="-apple-system,sans-serif" font-size="12.5"> · </text>
  <text x="376" y="308" fill="#6366f1" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="500">Choose folder</text>
  <text x="380" y="330" fill="#475569" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">📁  Folders are automatically compressed as ZIP</text>

  <!-- Expiry (y 374–420) -->
  <text x="60" y="385" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" letter-spacing="0.07em">EXPIRY</text>
  <!-- pills row y=393 -->
  <rect x="60"  y="393" width="40" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="80"  y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">1 hr</text>
  <rect x="106" y="393" width="46" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="129" y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">2 hrs</text>
  <rect x="158" y="393" width="46" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="181" y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">4 hrs</text>
  <rect x="210" y="393" width="46" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="233" y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">6 hrs</text>
  <!-- 1 day active -->
  <rect x="262" y="393" width="50" height="22" rx="11" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>
  <text x="287" y="408" fill="#a5b4fc" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">1 day</text>
  <rect x="318" y="393" width="54" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="345" y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">3 days</text>
  <rect x="378" y="393" width="54" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="405" y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">7 days</text>
  <rect x="438" y="393" width="58" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="467" y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">30 days</text>
  <rect x="502" y="393" width="66" height="22" rx="11" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="535" y="408" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="10.5" text-anchor="middle">Unlimited</text>

  <!-- divider -->
  <line x1="60" y1="430" x2="700" y2="430" stroke="#171730" stroke-width="1"/>

  <!-- Password protection (y 438–476) -->
  <text x="60" y="448" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" letter-spacing="0.07em">PASSWORD PROTECTION</text>
  <text x="60" y="463" fill="#475569" font-family="-apple-system,sans-serif" font-size="11">AES-256 encryption</text>
  <!-- toggle (off) -->
  <rect x="664" y="440" width="36" height="20" rx="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="674" cy="450" r="7" fill="#252545"/>

  <!-- divider -->
  <line x1="60" y1="482" x2="700" y2="482" stroke="#171730" stroke-width="1"/>

  <!-- Max downloads (y 490–530) -->
  <text x="60" y="500" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" letter-spacing="0.07em">MAX. DOWNLOADS</text>
  <text x="60" y="515" fill="#475569" font-family="-apple-system,sans-serif" font-size="11">0 = unlimited</text>
  <!-- input box -->
  <rect x="616" y="490" width="76" height="28" rx="8" fill="rgba(255,255,255,0.04)" stroke="#1e1e3a" stroke-width="1"/>
  <text x="654" y="508" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-size="12.5" text-anchor="middle">0</text>

  <!-- Upload button (y 538–582) -->
  <rect x="60" y="538" width="620" height="44" rx="10" fill="url(#btng)" opacity="0.42"/>
  <path d="M369,553 L369,558" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="365,556 369,552 373,556" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M362,564 L362,566 a2,2 0 0 0 2,2 L376,568 a2,2 0 0 0 2,-2 L378,564" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="390" y="565" fill="white" font-family="-apple-system,sans-serif" font-weight="700" font-size="14">Upload</text>

  <!-- ── My Files (y 608–760) ── -->
  <text x="40" y="610" fill="#64748b" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" letter-spacing="0.07em">MY FILES</text>

  <!-- File 1 -->
  <rect x="40" y="620" width="680" height="54" rx="12" fill="#12122a" stroke="#191935" stroke-width="1"/>
  <rect x="58" y="633" width="14" height="14" rx="3" fill="none" stroke="#2a3a4a" stroke-width="1.2"/>
  <rect x="84" y="629" width="32" height="32" rx="7" fill="rgba(99,102,241,0.1)"/>
  <path d="M93,635 L93,652 a1,1 0 0 0 1,1 L104,653 a1,1 0 0 0 1,-1 L105,639 L99,633 Z" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-linejoin="round"/>
  <polyline points="99,633 99,640 105,640" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="126" y="643" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-weight="600" font-size="13">project-backup-2025.zip</text>
  <rect x="294" y="633" width="72" height="14" rx="3" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
  <text x="330" y="644" fill="#fbbf24" font-family="-apple-system,sans-serif" font-size="9" text-anchor="middle">🔒 AES-256</text>
  <text x="126" y="662" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">142.7 MB</text>
  <text x="194" y="662" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">⏱ 6d 14h</text>
  <text x="256" y="662" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">↓ 2 ∞</text>
  <rect x="646" y="631" width="58" height="26" rx="6" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="675" y="648" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11" text-anchor="middle">Link</text>

  <!-- File 2 -->
  <rect x="40" y="682" width="680" height="54" rx="12" fill="#12122a" stroke="#191935" stroke-width="1"/>
  <rect x="58" y="695" width="14" height="14" rx="3" fill="none" stroke="#2a3a4a" stroke-width="1.2"/>
  <rect x="84" y="691" width="32" height="32" rx="7" fill="rgba(99,102,241,0.1)"/>
  <path d="M93,697 L93,714 a1,1 0 0 0 1,1 L104,715 a1,1 0 0 0 1,-1 L105,701 L99,695 Z" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-linejoin="round"/>
  <polyline points="99,695 99,702 105,702" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="126" y="705" fill="#e2e8f0" font-family="-apple-system,sans-serif" font-weight="600" font-size="13">onboarding-guide.pdf</text>
  <text x="126" y="724" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">3.2 MB</text>
  <text x="180" y="724" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">⏱ 23h 41min</text>
  <text x="270" y="724" fill="#64748b" font-family="-apple-system,sans-serif" font-size="11">↓ 5 ∞</text>
  <rect x="646" y="693" width="58" height="26" rx="6" fill="none" stroke="#1e1e3a" stroke-width="1"/>
  <text x="675" y="710" fill="#94a3b8" font-family="-apple-system,sans-serif" font-size="11" text-anchor="middle">Link</text>

  <!-- Bottom fade -->
  <rect x="0" y="740" width="760" height="60" fill="url(#fade)"/>

  </g>
</svg>
